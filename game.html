<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Neon Breakout</title>
<style>
body{margin:0;background:#05050f;color:#f3f4f6;font-family:sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;overflow:hidden;}
.box{background:#111827;padding:16px;border-radius:12px;box-shadow:0 0 30px rgba(139,92,246,0.3);text-align:center;border:1px solid rgba(139,92,246,0.2);}
h1{margin:0 0 6px;font-size:1.5rem;background:linear-gradient(135deg,#ec4899,#8b5cf6,#3b82f6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
canvas{background:#030712;border-radius:6px;display:block;margin:10px auto;border:1px solid #1f2937;}
.ui{display:flex;justify-content:space-between;width:600px;font-weight:600;font-size:1.05rem;margin:8px auto 0;}
button{background:linear-gradient(135deg,#ec4899,#8b5cf6);color:#fff;border:none;padding:8px 20px;font-size:1rem;font-weight:600;border-radius:6px;cursor:pointer;margin-top:12px;box-shadow:0 4px 12px rgba(236,72,153,0.4);}
button:hover{transform:translateY(-1px);}
</style>
</head>
<body>
<div class="box">
<h1>NEON BREAKOUT</h1>
<canvas id="cvs" width="600" height="400"></canvas>
<div class="ui"><div>Score: <span id="s">0</span></div><div>Lives: <span id="l">3</span></div></div>
<button id="btn">Start Game</button>
</div>
<script>
const c = document.getElementById('cvs'), x = c.getContext('2d');
const sEl = document.getElementById('s'), lEl = document.getElementById('l'), btn = document.getElementById('btn');
let state = 'S', score = 0, lives = 3, rightKey = false, leftKey = false;
let pad = { w: 90, h: 12, x: 255, y: 365, dx: 7 };
let ball = { x: 300, y: 200, r: 6, dx: 4, dy: -4 };
let bricks = [], parts = [];
const cols = ['#ec4899','#8b5cf6','#3b82f6','#10b981','#f59e0b'];

function initBricks() {
  bricks = [];
  for (let col = 0; col < 8; col++) {
    bricks[col] = [];
    for (let row = 0; row < 5; row++) {
      bricks[col][row] = { x: col * 71 + 24, y: row * 24 + 35, w: 63, h: 16, alive: true, color: cols[row] };
    }
  }
}

function spawnParts(px, py, col) {
  for (let i = 0; i < 10; i++) {
    parts.push({ x: px, y: py, dx: (Math.random() - 0.5) * 5, dy: (Math.random() - 0.5) * 5, r: Math.random() * 2.5 + 1, color: col, life: 25 });
  }
}

window.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === 'Right') rightKey = true;
  if (e.key === 'ArrowLeft' || e.key === 'Left') leftKey = true;
  if (e.code === 'Space' && (state === 'S' || state === 'O' || state === 'W')) resetGame();
});
window.addEventListener('keyup', e => {
  if (e.key === 'ArrowRight' || e.key === 'Right') rightKey = false;
  if (e.key === 'ArrowLeft' || e.key === 'Left') leftKey = false;
});
c.addEventListener('mousemove', e => {
  let rect = c.getBoundingClientRect();
  pad.x = e.clientX - rect.left - pad.w / 2;
  pad.x = Math.max(0, Math.min(c.width - pad.w, pad.x));
});
btn.addEventListener('click', resetGame);

function resetGame() {
  score = 0; lives = 3;
  sEl.textContent = score; lEl.textContent = lives;
  ball.x = 300; ball.y = 250; ball.dx = 4 * (Math.random() > 0.5 ? 1 : -1); ball.dy = -4;
  pad.x = 255;
  initBricks();
  state = 'P';
  btn.style.display = 'none';
}

function update() {
  if (state !== 'P') return;
  if (rightKey && pad.x < c.width - pad.w) pad.x += pad.dx;
  if (leftKey && pad.x > 0) pad.x -= pad.dx;
  ball.x += ball.dx; ball.y += ball.dy;
  if (ball.x - ball.r < 0 || ball.x + ball.r > c.width) ball.dx = -ball.dx;
  if (ball.y - ball.r < 0) ball.dy = -ball.dy;
  if (ball.y + ball.r >= pad.y && ball.x >= pad.x && ball.x <= pad.x + pad.w && ball.y <= pad.y + pad.h) {
    let hitOffset = ball.x - (pad.x + pad.w / 2);
    ball.dx = hitOffset * 0.12;
    ball.dy = -Math.abs(ball.dy);
  } else if (ball.y + ball.r > c.height) {
    lives--; lEl.textContent = lives;
    if (lives <= 0) {
      state = 'O'; btn.style.display = 'inline-block'; btn.textContent = 'Try Again';
    } else {
      ball.x = 300; ball.y = 200; ball.dx = 4; ball.dy = -4;
    }
  }
  let won = true;
  for (let col = 0; col < 8; col++) {
    for (let row = 0; row < 5; row++) {
      let b = bricks[col][row];
      if (b.alive) {
        won = false;
        if (ball.x > b.x && ball.x < b.x + b.w && ball.y > b.y && ball.y < b.y + b.h) {
          ball.dy = -ball.dy; b.alive = false; score += 10; sEl.textContent = score;
          spawnParts(b.x + b.w / 2, b.y + b.h / 2, b.color);
        }
      }
    }
  }
  if (won) { state = 'W'; btn.style.display = 'inline-block'; btn.textContent = 'Play Again'; }
}

function draw() {
  x.clearRect(0, 0, c.width, c.height);
  for (let col = 0; col < 8; col++) {
    for (let row = 0; row < 5; row++) {
      let b = bricks[col][row];
      if (b.alive) {
        x.beginPath(); x.roundRect(b.x, b.y, b.w, b.h, 4);
        x.fillStyle = b.color; x.shadowBlur = 10; x.shadowColor = b.color;
        x.fill(); x.closePath();
      }
    }
  }
  x.beginPath(); x.roundRect(pad.x, pad.y, pad.w, pad.h, 6);
  x.fillStyle = '#ec4899'; x.shadowBlur = 15; x.shadowColor = '#ec4899';
  x.fill(); x.closePath();
  x.beginPath(); x.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
  x.fillStyle = '#38bdf8'; x.shadowBlur = 12; x.shadowColor = '#38bdf8';
  x.fill(); x.closePath(); x.shadowBlur = 0;
  parts.forEach((p, idx) => {
    p.x += p.dx; p.y += p.dy; p.life--;
    x.beginPath(); x.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    x.fillStyle = p.color; x.globalAlpha = p.life / 25;
    x.fill(); x.closePath(); x.globalAlpha = 1;
    if (p.life <= 0) parts.splice(idx, 1);
  });
  if (state !== 'P') {
    x.fillStyle = 'rgba(3,7,18,0.85)'; x.fillRect(0, 0, c.width, c.height);
    x.fillStyle = state === 'W' ? '#10b981' : (state === 'O' ? '#ec4899' : '#f3f4f6');
    x.font = 'bold 28px sans-serif'; x.textAlign = 'center';
    x.fillText(state === 'W' ? 'VICTORY!' : (state === 'O' ? 'GAME OVER' : 'READY TO PLAY'), c.width / 2, c.height / 2);
  }
}

function loop() {
  update(); draw(); requestAnimationFrame(loop);
}

initBricks(); loop();
</script>
</body>
</html>
