<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neon Breakout - Built by AI Agent in 1 Prompt</title>
<style>
  body {
    margin: 0;
    padding: 0;
    background: #0b0f19;
    color: #f3f4f6;
    font-family: 'Inter', system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow: hidden;
  }
  .game-container {
    text-align: center;
    background: rgba(17, 24, 39, 0.85);
    padding: 20px;
    border-radius: 16px;
    box-shadow: 0 0 40px rgba(139, 92, 246, 0.3), inset 0 0 15px rgba(236, 72, 153, 0.1);
    border: 1px solid rgba(139, 92, 246, 0.2);
  }
  h1 {
    margin: 0 0 8px 0;
    font-size: 1.75rem;
    background: linear-gradient(135deg, #ec4899, #8b5cf6, #3b82f6);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: -0.025em;
  }
  p.subtitle {
    margin: 0 0 16px 0;
    color: #9ca3af;
    font-size: 0.9rem;
  }
  canvas {
    background: #05070c;
    border-radius: 8px;
    display: block;
    margin: 0 auto;
    box-shadow: 0 0 20px rgba(0,0,0,0.8);
    border: 1px solid #1f2937;
  }
  .ui-bar {
    display: flex;
    justify-content: space-between;
    width: 600px;
    margin: 12px auto 0 auto;
    font-size: 1.1rem;
    font-weight: 600;
    color: #e5e7eb;
  }
  .btn {
    background: linear-gradient(135deg, #ec4899, #8b5cf6);
    color: white;
    border: none;
    padding: 10px 24px;
    font-size: 1rem;
    font-weight: 600;
    border-radius: 8px;
    cursor: pointer;
    margin-top: 16px;
    transition: transform 0.1s ease, box-shadow 0.1s ease;
    box-shadow: 0 4px 12px rgba(236, 72, 153, 0.4);
  }
  .btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 16px rgba(236, 72, 153, 0.6);
  }
  .btn:active {
    transform: translateY(0);
  }
</style>
</head>
<body>

<div class="game-container">
  <h1>NEON BREAKOUT</h1>
  <p class="subtitle">Prompt: "Build a glowing retro arcade breakout game with particle effects and smooth controls"</p>
  
  <canvas id="gameCanvas" width="600" height="400"></canvas>
  
  <div class="ui-bar">
    <div>Score: <span id="scoreVal">0</span></div>
    <div>Lives: <span id="livesVal">3</span></div>
  </div>

  <button id="startBtn" class="btn">Start Game (Press Space / Click)</button>
</div>

<script>
/**
 * Neon Breakout Game Logic
 * Implements canvas rendering, particle systems, collision detection,
 * paddle and keyboard/mouse controls, and game states.
 */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scoreVal = document.getElementById('scoreVal');
const livesVal = document.getElementById('livesVal');
const startBtn = document.getElementById('startBtn');

let score = 0;
let lives = 3;
let gameState = 'START'; // START, PLAYING, GAMEOVER, WIN

// Paddle Configuration
const paddle = {
  w: 100,
  h: 14,
  x: canvas.width / 2 - 50,
  y: canvas.height - 30,
  dx: 8,
  color: '#ec4899'
};

// Ball Configuration
const ball = {
  x: canvas.width / 2,
  y: canvas.height - 50,
  r: 7,
  speed: 5,
  dx: 4,
  dy: -4,
  color: '#38bdf8'
};

// Bricks Grid Configuration
const brickRowCount = 5;
const brickColumnCount = 8;
const brickWidth = 64;
const brickHeight = 20;
const brickPadding = 10;
const brickOffsetTop = 40;
const brickOffsetLeft = 32;

let bricks = [];
function initBricks() {
  bricks = [];
  const colors = ['#ec4899', '#8b5cf6', '#3b82f6', '#10b981', '#f59e0b'];
  for (let c = 0; c < brickColumnCount; c++) {
    bricks[c] = [];
    for (let r = 0; r < brickRowCount; r++) {
      bricks[c][r] = {
        x: c * (brickWidth + brickPadding) + brickOffsetLeft,
        y: r * (brickHeight + brickPadding) + brickOffsetTop,
        status: 1,
        color: colors[r % colors.length]
      };
    }
  }
}

// Particle System for Brick Destruction
let particles = [];
function createParticles(x, y, color) {
  for (let i = 0; i < 12; i++) {
    particles.push({
      x: x,
      y: y,
      dx: (Math.random() - 0.5) * 6,
      dy: (Math.random() - 0.5) * 6,
      r: Math.random() * 3 + 1,
      color: color,
      life: 30
    });
  }
}

// Input Controls state
let rightPressed = false;
let leftPressed = false;

document.addEventListener('keydown', (e) => {
  if (e.key === 'Right' || e.key === 'ArrowRight') rightPressed = true;
  else if (e.key === 'Left' || e.key === 'ArrowLeft') leftPressed = true;
  else if (e.key === ' ' || e.code === 'Space') {
    if (gameState === 'START' || gameState === 'GAMEOVER' || gameState === 'WIN') {
      startGame();
    }
  }
});

document.addEventListener('keyup', (e) => {
  if (e.key === 'Right' || e.key === 'ArrowRight') rightPressed = false;
  else if (e.key === 'Left' || e.key === 'ArrowLeft') leftPressed = false;
});

canvas.addEventListener('mousemove', (e) => {
  const rect = canvas.getBoundingClientRect();
  const mouseX = e.clientX - rect.left;
  paddle.x = mouseX - paddle.w / 2;
  if (paddle.x < 0) paddle.x = 0;
  if (paddle.x + paddle.w > canvas.width) paddle.x = canvas.width - paddle.w;
});

startBtn.addEventListener('click', () => {
  startGame();
});

function startGame() {
  score = 0;
  lives = 3;
  scoreVal.textContent = score;
  livesVal.textContent = lives;
  ball.x = canvas.width / 2;
  ball.y = canvas.height - 50;
  ball.dx = 4 * (Math.random() > 0.5 ? 1 : -1);
  ball.dy = -4;
  paddle.x = canvas.width / 2 - paddle.w / 2;
  initBricks();
  gameState = 'PLAYING';
  startBtn.style.display = 'none';
}

// Collision Detection for Bricks
function collisionDetection() {
  for (let c = 0; c < brickColumnCount; c++) {
    for (let r = 0; r < brickRowCount; r++) {
      const b = bricks[c][r];
      if (b.status === 1) {
        if (
          ball.x > b.x &&
          ball.x < b.x + brickWidth &&
          ball.y > b.y &&
          ball.y < b.y + brickHeight
        ) {
          ball.dy = -ball.dy;
          b.status = 0;
          score += 10;
          scoreVal.textContent = score;
          createParticles(b.x + brickWidth / 2, b.y + brickHeight / 2, b.color);
          
          // Check for win condition
          let won = true;
          for (let cc = 0; cc < brickColumnCount; cc++) {
            for (let rr = 0; rr < brickRowCount; rr++) {
              if (bricks[cc][rr].status === 1) won = false;
            }
          }
          if (won) {
            gameState = 'WIN';
            startBtn.style.display = 'inline-block';
            startBtn.textContent = 'Play Again';
          }
        }
      }
    }
  }
}

// Render Functions with Neon Glow
function drawBall() {
  ctx.beginPath();
  ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
  ctx.fillStyle = ball.color;
  ctx.shadowBlur = 12;
  ctx.shadowColor = ball.color;
  ctx.fill();
  ctx.closePath();
  ctx.shadowBlur = 0;
}

function drawPaddle() {
  ctx.beginPath();
  ctx.roundRect(paddle.x, paddle.y, paddle.w, paddle.h, 6);
  ctx.fillStyle = paddle.color;
  ctx.shadowBlur = 15;
  ctx.shadowColor = paddle.color;
  ctx.fill();
  ctx.closePath();
  ctx.shadowBlur = 0;
}

function drawBricks() {
  for (let c = 0; c < brickColumnCount; c++) {
    for (let r = 0; r < brickRowCount; r++) {
      if (bricks[c][r].status === 1) {
        const b = bricks[c][r];
        ctx.beginPath();
        ctx.roundRect(b.x, b.y, brickWidth, brickHeight, 4);
        ctx.fillStyle = b.color;
        ctx.shadowBlur = 10;
        ctx.shadowColor = b.color;
        ctx.fill();
        ctx.closePath();
        ctx.shadowBlur = 0;
      }
    }
  }
}

function drawParticles() {
  particles.forEach((p, index) => {
    p.x += p.dx;
    p.y += p.dy;
    p.life--;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fillStyle = p.color;
    ctx.globalAlpha = p.life / 30;
    ctx.fill();
    ctx.closePath();
    ctx.globalAlpha = 1.0;
    if (p.life <= 0) particles.splice(index, 1);
  });
}

// Game Update Loop
function update() {
  if (gameState !== 'PLAYING') return;

  if (rightPressed && paddle.x < canvas.width - paddle.w) {
    paddle.x += paddle.dx;
  } else if (leftPressed && paddle.x > 0) {
    paddle.x -= paddle.dx;
  }

  ball.x += ball.dx;
  ball.y += ball.dy;

  // Wall collisions
  if (ball.x + ball.r > canvas.width || ball.x - ball.r < 0) {
    ball.dx = -ball.dx;
  }
  if (ball.y - ball.r < 0) {
    ball.dy = -ball.dy;
  } else if (ball.y + ball.r > canvas.height) {
    // Paddle collision or lose life
    if (ball.x > paddle.x && ball.x < paddle.x + paddle.w) {
      let hitPoint = ball.x - (paddle.x + paddle.w / 2);
      ball.dx = hitPoint * 0.15;
      ball.dy = -Math.abs(ball.dy);
    } else {
      lives--;
      livesVal.textContent = lives;
      if (lives <= 0) {
        gameState = 'GAMEOVER';
        startBtn.style.display = 'inline-block';
        startBtn.textContent = 'Try Again';
      } else {
        ball.x = canvas.width / 2;
        ball.y = canvas.height - 50;
        ball.dx = 4 * (Math.random() > 0.5 ? 1 : -1);
        ball.dy = -4;
        paddle.x = canvas.width / 2 - paddle.w / 2;
      }
    }
  }

  collisionDetection();
}

// Frame Render
function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  drawBricks();
  drawPaddle();
  drawBall();
  drawParticles();

  if (gameState === 'START') {
    ctx.fillStyle = 'rgba(5, 7, 12, 0.75)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#f3f4f6';
    ctx.font = 'bold 24px Inter, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('PRESS START TO PLAY', canvas.width / 2, canvas.height / 2 - 10);
  } else if (gameState === 'GAMEOVER') {
    ctx.fillStyle = 'rgba(5, 7, 12, 0.85)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#ec4899';
    ctx.font = 'bold 32px Inter, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 10);
  } else if (gameState === 'WIN') {
    ctx.fillStyle = 'rgba(5, 7, 12, 0.85)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#10b981';
    ctx.font = 'bold 32px Inter, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('YOU WIN! VICTORY!', canvas.width / 2, canvas.height / 2 - 10);
  }
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

initBricks();
loop();
</script>

</body>
</html>
